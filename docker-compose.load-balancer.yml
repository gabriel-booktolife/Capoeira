name: chao-load-balancer

services:
  nginx:
    image: nginx:1.27-alpine
    init: true
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/capoeira.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1/nginx-health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    stop_grace_period: 10s

networks:
  proxy:
    external: true
    name: chao-proxy
